<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <style>
    .bg{fill:#0d1117}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.sensor{fill:#161b22;stroke:#3fb950;stroke-width:2}.hmi{fill:#161b22;stroke:#d29922;stroke-width:2}.motor{fill:#161b22;stroke:#f85149;stroke-width:2}.t{fill:#f0f6fc;font-family:Arial,sans-serif}.s{fill:#8b949e;font-family:Arial,sans-serif}.a{stroke:#8b949e;stroke-width:2;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/></marker></defs>
  <rect class="bg" width="1200" height="620" rx="18"/>
  <text class="t" x="600" y="48" text-anchor="middle" font-size="30" font-weight="700">Embedded Motor Condition Monitoring Architecture</text>

  <rect class="sensor" x="50" y="180" width="215" height="120" rx="16"/>
  <text class="t" x="157" y="220" text-anchor="middle" font-size="22" font-weight="700">MPU6050 #1</text>
  <text class="s" x="157" y="253" text-anchor="middle" font-size="17">Motor 1 vibration</text>
  <text class="s" x="157" y="279" text-anchor="middle" font-size="16">I²C 400 kHz</text>

  <rect class="sensor" x="935" y="180" width="215" height="120" rx="16"/>
  <text class="t" x="1042" y="220" text-anchor="middle" font-size="22" font-weight="700">MPU6050 #2</text>
  <text class="s" x="1042" y="253" text-anchor="middle" font-size="17">Motor 2 vibration</text>
  <text class="s" x="1042" y="279" text-anchor="middle" font-size="16">I²C 100 kHz</text>

  <rect class="box" x="375" y="145" width="450" height="205" rx="18"/>
  <text class="t" x="600" y="190" text-anchor="middle" font-size="27" font-weight="700">ESP32-WROOM-32 Edge Node</text>
  <text class="t" x="600" y="235" text-anchor="middle" font-size="20">Core 1: sensing + DSP / FFT</text>
  <text class="t" x="600" y="270" text-anchor="middle" font-size="20">Core 0: Wi-Fi + UDP + MQTT + WebSocket + HTTP</text>
  <text class="s" x="600" y="315" text-anchor="middle" font-size="17">400 Hz sampling · 256-sample frames · FreeRTOS mutex-protected buffers</text>

  <line class="a" x1="265" y1="240" x2="375" y2="240"/>
  <line class="a" x1="935" y1="240" x2="825" y2="240"/>

  <rect class="hmi" x="70" y="430" width="285" height="125" rx="16"/>
  <text class="t" x="212" y="470" text-anchor="middle" font-size="22" font-weight="700">ESP8266 Local HMI</text>
  <text class="s" x="212" y="502" text-anchor="middle" font-size="16">OLED + keypad + buzzer</text>
  <text class="s" x="212" y="528" text-anchor="middle" font-size="16">QUIC-inspired UDP path</text>

  <rect class="box" x="455" y="430" width="290" height="125" rx="16"/>
  <text class="t" x="600" y="470" text-anchor="middle" font-size="22" font-weight="700">Web Dashboard</text>
  <text class="s" x="600" y="502" text-anchor="middle" font-size="16">HTTP + WebSocket</text>
  <text class="s" x="600" y="528" text-anchor="middle" font-size="16">Metrics + FFT + controls</text>

  <rect class="motor" x="845" y="430" width="285" height="125" rx="16"/>
  <text class="t" x="987" y="470" text-anchor="middle" font-size="22" font-weight="700">Motor Power Stage</text>
  <text class="s" x="987" y="502" text-anchor="middle" font-size="16">TB6612FNG · 20 kHz PWM</text>
  <text class="s" x="987" y="528" text-anchor="middle" font-size="16">2 × DC motors</text>

  <line class="a" x1="500" y1="350" x2="300" y2="430"/>
  <line class="a" x1="600" y1="350" x2="600" y2="430"/>
  <line class="a" x1="700" y1="350" x2="900" y2="430"/>
</svg>
