<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><style>.bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d;stroke-width:2}.t{fill:#f0f6fc;font-family:Arial,sans-serif}.s{fill:#8b949e;font-family:Arial,sans-serif}.g{fill:#3fb950}.y{fill:#d29922}.r{fill:#f85149}.b{fill:#58a6ff}</style><rect class="bg" width="1200" height="560" rx="18"/><text class="t" x="600" y="48" text-anchor="middle" font-size="30" font-weight="700">Experimental Validation Summary</text><rect class="card" x="55" y="95" width="330" height="175" rx="16"/><text class="b" x="220" y="135" text-anchor="middle" font-size="23" font-family="Arial" font-weight="700">Baseline</text><text class="t" x="220" y="177" text-anchor="middle" font-size="34" font-weight="700">0.03–0.05 g</text><text class="s" x="220" y="211" text-anchor="middle" font-size="17">reported RMS noise floor</text><rect class="card" x="435" y="95" width="330" height="175" rx="16"/><text class="r" x="600" y="135" text-anchor="middle" font-size="23" font-family="Arial" font-weight="700">Induced Imbalance</text><text class="t" x="600" y="177" text-anchor="middle" font-size="34" font-weight="700">43.8 Hz</text><text class="s" x="600" y="211" text-anchor="middle" font-size="17">dominant rotational component</text><text class="s" x="600" y="239" text-anchor="middle" font-size="16">≈ 2628 RPM equivalent</text><rect class="card" x="815" y="95" width="330" height="175" rx="16"/><text class="y" x="980" y="135" text-anchor="middle" font-size="23" font-family="Arial" font-weight="700">Mechanical Crosstalk</text><text class="t" x="980" y="177" text-anchor="middle" font-size="34" font-weight="700">2.02 g vs 0.14 g</text><text class="s" x="980" y="211" text-anchor="middle" font-size="17">source vs coupled vibration</text><text class="s" x="980" y="239" text-anchor="middle" font-size="16">≈ 14× separation</text><rect class="card" x="145" y="325" width="410" height="165" rx="16"/><text class="g" x="350" y="367" text-anchor="middle" font-size="23" font-family="Arial" font-weight="700">Health Indicator</text><text class="t" x="350" y="414" text-anchor="middle" font-size="34" font-weight="700">95% vs 33%</text><text class="s" x="350" y="450" text-anchor="middle" font-size="17">nominal vs anomalous test condition</text><rect class="card" x="645" y="325" width="410" height="165" rx="16"/><text class="b" x="850" y="367" text-anchor="middle" font-size="23" font-family="Arial" font-weight="700">Local UDP Path</text><text class="t" x="850" y="414" text-anchor="middle" font-size="34" font-weight="700">&lt; 20 ms</text><text class="s" x="850" y="450" text-anchor="middle" font-size="17">reported average local-network reaction time</text></svg>