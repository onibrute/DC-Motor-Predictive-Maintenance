<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <style>.bg{fill:#0d1117}.lane{stroke:#30363d;stroke-width:2}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.t{fill:#f0f6fc;font-family:Arial,sans-serif}.s{fill:#8b949e;font-family:Arial,sans-serif}.msg{stroke:#3fb950;stroke-width:3;marker-end:url(#m)}.cmd{stroke:#f85149;stroke-width:3;marker-end:url(#r)}</style>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f85149"/></marker></defs>
  <rect class="bg" width="1100" height="640" rx="18"/>
  <text class="t" x="550" y="45" text-anchor="middle" font-size="29" font-weight="700">“QUIC-lite” — Custom QUIC-Inspired UDP Path</text>
  <text class="s" x="550" y="76" text-anchor="middle" font-size="17">Project terminology — not an implementation of IETF QUIC</text>
  <rect class="box" x="120" y="105" width="260" height="70" rx="14"/><text class="t" x="250" y="148" text-anchor="middle" font-size="21" font-weight="700">ESP8266 HMI</text>
  <rect class="box" x="720" y="105" width="260" height="70" rx="14"/><text class="t" x="850" y="148" text-anchor="middle" font-size="21" font-weight="700">ESP32 Edge Node</text>
  <line class="lane" x1="250" y1="175" x2="250" y2="585"/><line class="lane" x1="850" y1="175" x2="850" y2="585"/>
  <text class="s" x="550" y="215" text-anchor="middle" font-size="18">Discovery: sequential local-subnet scan</text>
  <line class="msg" x1="270" y1="250" x2="830" y2="250"/><text class="t" x="550" y="240" text-anchor="middle" font-size="17">PING_DISCOVERY (UDP)</text>
  <line class="msg" x1="830" y1="305" x2="270" y2="305"/><text class="t" x="550" y="295" text-anchor="middle" font-size="17">Telemetry / discovery response path</text>
  <text class="s" x="550" y="355" text-anchor="middle" font-size="18">Runtime telemetry: JSON datagrams</text>
  <line class="msg" x1="830" y1="390" x2="270" y2="390"/><text class="t" x="550" y="380" text-anchor="middle" font-size="17">RMS · PWM · state · dominant frequency · crest factor</text>
  <text class="s" x="550" y="440" text-anchor="middle" font-size="18">Low-latency operator commands</text>
  <line class="cmd" x1="270" y1="480" x2="830" y2="480"/><text class="t" x="550" y="470" text-anchor="middle" font-size="17">A=&lt;PWM&gt; / B=&lt;PWM&gt; / STOP / ESTOP</text>
  <rect x="120" y="535" width="860" height="70" rx="14" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text class="t" x="550" y="563" text-anchor="middle" font-size="17" font-weight="700">QUIC-inspired design goal: avoid TCP setup overhead on the local control path</text>
  <text class="s" x="550" y="589" text-anchor="middle" font-size="15">No QUIC encryption, streams, congestion control, connection IDs, TLS 1.3 handshake or RFC 9000 wire format</text>
</svg>